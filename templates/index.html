<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday Calendar</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css"
        rel="stylesheet"
    >

    <style>
        #ad-leaderboard {
            background-color: #f0f0f0;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #ad-sidebar {
            background-color: #f0f0f0;
            min-height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Holiday Calendar</a>
            <div class="d-flex flex-column flex-md-row gap-2 ms-auto">
                <select id="country-select" class="form-select" aria-label="Country">
                    <option value="">Select Country</option>
                </select>
                <select id="year-select" class="form-select" aria-label="Year"></select>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-3">
            <div class="col-12">
                <div id="ad-leaderboard" class="text-center">[Leaderboard Ad Space]</div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-9 col-md-12 mb-4">
                <div id="calendar"></div>
            </div>
            <div class="col-lg-3 col-md-12 text-center">
                <div id="ad-sidebar">[Sidebar Ad Space]</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const countrySelect = document.getElementById("country-select");
        const yearSelect = document.getElementById("year-select");
        const currentYear = new Date().getFullYear();
        let calendar;

        function populateYearDropdown() {
            yearSelect.innerHTML = "";
            for (let year = 2020; year <= 2030; year += 1) {
                const option = document.createElement("option");
                option.value = String(year);
                option.textContent = String(year);
                if (year === currentYear) {
                    option.selected = true;
                }
                yearSelect.appendChild(option);
            }
        }

        async function loadCountries() {
            const response = await fetch("/api/countries");
            if (!response.ok) {
                throw new Error("Failed to fetch countries");
            }
            const countries = await response.json();

            countrySelect.innerHTML = "";
            Object.entries(countries)
                .sort((a, b) => a[1].localeCompare(b[1]))
                .forEach(([code, name]) => {
                    const option = document.createElement("option");
                    option.value = code;
                    option.textContent = `${name} (${code})`;
                    countrySelect.appendChild(option);
                });

            const usOption = Array.from(countrySelect.options).find(
                (opt) => opt.value === "US"
            );
            if (usOption) {
                countrySelect.value = "US";
            }
        }

        function initializeCalendar() {
            calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
                initialView: "dayGridMonth",
                events: []
            });
            calendar.render();
        }

        async function refreshHolidays() {
            const countryCode = countrySelect.value;
            const year = yearSelect.value;

            if (!countryCode || !year) {
                calendar.removeAllEvents();
                return;
            }

            const response = await fetch(`/api/holidays/${countryCode}/${year}`);
            if (!response.ok) {
                throw new Error("Failed to fetch holidays");
            }

            const holidays = await response.json();
            calendar.removeAllEvents();
            calendar.addEventSource(holidays);
        }

        async function initializePage() {
            populateYearDropdown();
            initializeCalendar();
            await loadCountries();
            await refreshHolidays();

            countrySelect.addEventListener("change", refreshHolidays);
            yearSelect.addEventListener("change", refreshHolidays);
        }

        initializePage().catch((error) => {
            console.error(error);
        });
    </script>
</body>
</html>
