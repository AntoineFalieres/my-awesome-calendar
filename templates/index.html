<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday Calendar</title>
    <!-- GDPR cookie consent banner script placeholder -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css"
        rel="stylesheet"
    >

    <style>
        #ad-leaderboard {
            background-color: #f0f0f0;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #ad-sidebar {
            background-color: #f0f0f0;
            min-height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Holiday Calendar</a>
            <div class="d-flex flex-column flex-md-row gap-2 ms-auto">
                <select id="country-select" class="form-select" aria-label="Country">
                    <option value="">Select Country</option>
                </select>
                <select id="year-select" class="form-select" aria-label="Year"></select>
                <select id="subdivision-select" class="form-select d-none" aria-label="Subdivision">
                    <option value="">Select Subdivision</option>
                </select>
                <select id="zone-select" class="form-select d-none" aria-label="Zone">
                    <option value="A">Zone A</option>
                    <option value="B">Zone B</option>
                    <option value="C">Zone C</option>
                </select>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-3">
            <div class="col-12">
                <div id="ad-leaderboard" class="text-center">[Leaderboard Ad Space]</div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-9 col-md-12 mb-4">
                <div id="calendar"></div>
            </div>
            <div class="col-lg-3 col-md-12 text-center">
                <div id="ad-sidebar">[Sidebar Ad Space]</div>
            </div>
        </div>
    </div>

    <footer class="py-3 border-top">
        <div class="container text-center">
            <a href="/mentions-legales" class="text-decoration-none me-3">Mentions Légales</a>
            <a href="/privacy-policy" class="text-decoration-none">Privacy Policy</a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const countrySelect = document.getElementById("country-select");
        const yearSelect = document.getElementById("year-select");
        const subdivisionSelect = document.getElementById("subdivision-select");
        const zoneSelect = document.getElementById("zone-select");
        const currentYear = new Date().getFullYear();
        let calendar;

        function populateYearDropdown() {
            yearSelect.innerHTML = "";
            for (let year = 2020; year <= 2030; year += 1) {
                const option = document.createElement("option");
                option.value = String(year);
                option.textContent = String(year);
                if (year === currentYear) {
                    option.selected = true;
                }
                yearSelect.appendChild(option);
            }
        }

        async function loadCountries() {
            try {
                const response = await fetch("/api/countries");
                if (!response.ok) {
                    console.error("Failed to fetch countries:", response.statusText);
                    return;
                }
                const countries = await response.json();

                countrySelect.innerHTML = "";
                Object.entries(countries)
                    .sort((a, b) => a[1].localeCompare(b[1]))
                    .forEach(([code, name]) => {
                        const option = document.createElement("option");
                        option.value = code;
                        option.textContent = `${name} (${code})`;
                        countrySelect.appendChild(option);
                    });

                const usOption = Array.from(countrySelect.options).find(
                    (opt) => opt.value === "US"
                );
                if (usOption) {
                    countrySelect.value = "US";
                }
            } catch (error) {
                console.error("Error loading countries:", error);
            }
        }

        function initializeCalendar() {
            calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
                initialView: "dayGridMonth",
                firstDay: 1,
                headerToolbar: {
                    left: "prev,next today",
                    center: "title",
                    right: "dayGridMonth,timeGridWeek"
                },
                buttonText: {
                    month: "Month",
                    week: "Week"
                }
            });
            calendar.render();
        }

        async function loadSubdivisions() {
            const countryCode = countrySelect.value;
            subdivisionSelect.innerHTML = '<option value="">Select Subdivision</option>';
            subdivisionSelect.classList.add("d-none");
            
            if (!countryCode) {
                return;
            }

            try {
                const response = await fetch(`/api/subdivisions/${countryCode}`);
                if (!response.ok) {
                    console.warn("No subdivisions for this country");
                    return;
                }
                const subdivisions = await response.json();
                
                if (Object.keys(subdivisions).length === 0) {
                    return;
                }

                Object.entries(subdivisions).forEach(([code, name]) => {
                    const option = document.createElement("option");
                    option.value = code;
                    option.textContent = name;
                    subdivisionSelect.appendChild(option);
                });

                subdivisionSelect.classList.remove("d-none");
            } catch (error) {
                console.error("Error loading subdivisions:", error);
            }
        }

        function toggleSelectors() {
            const countryCode = countrySelect.value;
            
            // Show zone selector only for France
            if (countryCode === "FR") {
                zoneSelect.classList.remove("d-none");
                subdivisionSelect.classList.add("d-none");
            } else {
                zoneSelect.classList.add("d-none");
                // Load subdivisions for other countries
                loadSubdivisions();
            }
        }

        async function refreshHolidays() {
            const countryCode = countrySelect.value;
            const year = yearSelect.value;

            if (!countryCode || !year) {
                calendar.removeAllEvents();
                return;
            }

            try {
                const allEvents = [];

                // Build URL with optional subdiv parameter
                let holidayUrl = `/api/holidays/${countryCode}/${year}`;
                const subdiv = subdivisionSelect.value || zoneSelect.value;
                if (subdiv) {
                    holidayUrl += `?subdiv=${subdiv}`;
                }

                const response = await fetch(holidayUrl);
                if (!response.ok) {
                    console.error("Failed to fetch holidays:", response.statusText);
                    return;
                }

                const holidays = await response.json();
                allEvents.push(...holidays);

                if (countryCode === "FR" && zoneSelect.value) {
                    const zone = zoneSelect.value;
                    const schoolUrl = `/api/school-holidays/${countryCode}/${year}?zone=${zone}`;
                    const schoolResponse = await fetch(schoolUrl);
                    if (schoolResponse.ok) {
                        const schoolHolidays = await schoolResponse.json();
                        allEvents.push(...schoolHolidays);
                    } else {
                        console.warn("Failed to fetch school holidays:", schoolResponse.statusText);
                    }
                }

                calendar.removeAllEvents();
                if (allEvents.length > 0) {
                    calendar.addEventSource(allEvents);
                }
            } catch (error) {
                console.error("Error loading holidays:", error);
            }
        }

        function initializePage() {
            populateYearDropdown();
            initializeCalendar();
            loadCountries();
            refreshHolidays();

            countrySelect.addEventListener("change", () => {
                toggleSelectors();
                refreshHolidays();
            });
            yearSelect.addEventListener("change", refreshHolidays);
            subdivisionSelect.addEventListener("change", refreshHolidays);
            zoneSelect.addEventListener("change", refreshHolidays);
        }

        // Wait for DOM to be ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializePage);
        } else {
            initializePage();
        }
    </script>
</body>
</html>
