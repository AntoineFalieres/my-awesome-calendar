{% macro ad_slot(name, placement) %}
{% if ad_config.enabled %}
<aside class="ad-slot ad-slot-{{ placement }}" aria-label="Publicité" hidden data-ad-container>
    <p class="ad-slot-label">Publicité</p>
    <ins
        class="adsbygoogle"
        data-ad-client="{{ ad_config.client_id }}"
        data-ad-slot="{{ ad_config['slot_' ~ placement] }}"
        data-slot-name="{{ name }}"
        data-ad-format="auto"
        data-full-width-responsive="true"
    ></ins>
</aside>
{% endif %}
{% endmacro %}
