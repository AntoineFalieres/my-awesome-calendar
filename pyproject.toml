[project]
name = "holiday-calendar"
version = "0.1.0"
description = "Flask web application displaying public holidays for different countries"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.0.0",
    "holidays==0.35",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
